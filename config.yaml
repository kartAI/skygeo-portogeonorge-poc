# GeoNorge -> Portolan PoC configuration. See geonorge-portolan-poc-plan.md
# and REPORT.md for the reasoning behind these defaults.

feed_url: "https://nedlasting.geonorge.no/geonorge/Tjenestefeed_daglig.xml"

sample:
  size: 20
  # Only formats portolan-cli 0.8.0 can actually ingest (verified against
  # src/portolan_cli/extension_registry.py: no GML/SOSI/PostGIS support).
  # All of these are normalized to GeoPackage via ogr2ogr before `portolan
  # add` ever sees them (see convert_gpkg.py) to sidestep a FileGDB-specific
  # gap in the CLI's cloud-native conversion pass and a UTF-8 BOM bug in its
  # GeoJSON reader.
  preferred_formats: ["GEOJSON", "GPKG", "GEOPACKAGE", "SHAPE", "FGDB"]
  prefer_national_extent: true
  random_seed: 42
  random_selection: true
  # Skip yearly "historiske data" reissues so the sample favors distinct,
  # current datasets instead of five years of the same admin-boundary layer.
  # "Bygningspunkt" and "Eiendomskart Teig" (Matrikkelen - every building/
  # cadastral parcel in Norway) are excluded too: both timed out ogr2ogr's
  # 900s conversion budget in testing (tens of millions of features
  # nationwide, no per-county split available) -- too large for this PoC's
  # scope.
  exclude_title_pattern: "historiske data|Bygningspunkt|Eiendomskart Teig"
  include_title_pattern: null

paths:
  cache_dir: "./cache"
  catalog_dir: "./catalog"

styling:
  enabled: true
  registry_url: "https://register.geonorge.no/api/tegneregler"
  # 80 (the plan's suggested default) produced false-positive matches on
  # short/generic titles in testing (e.g. "Kirkebygg" fuzzy-matched a coral
  # reef habitat entry at score 86); 90 keeps the good matches and drops those.
  match_threshold: 90
  fallback: "portolan-default"

portolan:
  catalog_id: "geonorge-portolan-poc"
  catalog_title: "GeoNorge -> Portolan PoC"
  catalog_description: >-
    Konseptbevis: et utvalg datasett fra Geonorges nedlastingstjeneste,
    crawlet, beriket med ISO19115-metadata og automatisk publisert som en
    Portolan STAC-katalog (GeoParquet/PMTiles).
  catalog_license: "other"
  catalog_license_url: "https://data.norge.no/nlod/no/2.0"
  workers: 4
  push_remote: null

pmtiles:
  # Requires the `tippecanoe` binary on PATH (brew install tippecanoe /
  # apt install tippecanoe). When false, no collection gets a PMTiles asset
  # and pmtiles.max_zoom is never written to the catalog's config.
  enabled: true
  # Caps tippecanoe's zoom range catalog-wide (via `portolan config set
  # pmtiles.max_zoom`, run once at init) so a nationwide dataset doesn't
  # trigger an unbounded auto-detected zoom range -- the main lever for
  # keeping PMTiles build time bounded. Set to null to let tippecanoe
  # auto-detect (can be slow/large for the bigger nationwide datasets).
  max_zoom: 12
