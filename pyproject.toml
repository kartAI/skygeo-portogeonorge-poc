[project]
name = "geonorge-portolan-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4,<8.5",
    "lxml>=6.1.3",
    "portolan-cli==0.8.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
geonorge-poc = "geonorge_portolan_poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geonorge_portolan_poc"]
